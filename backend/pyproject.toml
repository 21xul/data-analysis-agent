# 教程第 3 章的工程化约定：用 uv 管理虚拟环境与依赖（uv sync / uv add / uv remove）。
# 本机离线开发时可继续用组合环境；能联网后 `uv sync` 会依此生成 uv.lock 与 .venv。
# requirements.txt 保留为 pip 兼容清单，两处依赖需同步维护。
[project]
name = "insight-agent-v2"
version = "0.2.0"
description = "ReAct + LangGraph 数据分析 Agent（本地原型，C 路线，不发布）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "omegaconf>=2.3",
    "jieba>=0.42",
    "loguru>=0.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "openai>=1.40",
    "langchain>=1.2",
    "langchain-core>=1.2",
    "langchain-openai>=1.1",
    "langgraph>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false
