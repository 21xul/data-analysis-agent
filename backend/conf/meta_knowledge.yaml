# 构建期配置：声明哪些表 / 字段 / 指标进入元数据知识库（教程 2.5「配置驱动、可重复执行」）。
# 分工：业务语义（role / description / alias / 指标定义）来自本文件；
#       type / examples / 真实取值由 build_meta_knowledge.py 从实际数据补齐。
version: 1

# 上传型数据集不写死在这里：构建脚本会扫描 datasets 表，按推断出的列动态生成元数据。
dynamic_datasets: true

# 内置示例星型数仓的语义定义（对应教程第 1 章 fact_order + dim_*）
tables:
  - id: fact_order
    name: fact_order
    role: fact
    description: 订单事实表，记录订单数量与金额等核心度量。
    source: builtin
  - id: dim_region
    name: dim_region
    role: dim
    description: 地区维度表，描述订单发生的地理区域。
    source: builtin
  - id: dim_product
    name: dim_product
    role: dim
    description: 商品维度表，描述商品的品类与品牌。
    source: builtin
  - id: dim_customer
    name: dim_customer
    role: dim
    description: 客户维度表，描述下单客户的属性。
    source: builtin
  - id: dim_date
    name: dim_date
    role: dim
    description: 时间维度表，用于多时间粒度分析。
    source: builtin

columns:
  - id: fact_order.order_amount
    table_id: fact_order
    name: order_amount
    role: measure
    description: 订单金额。
    alias: [销售额, 订单金额, 收入, 成交金额]
    index_value: false
  - id: fact_order.order_quantity
    table_id: fact_order
    name: order_quantity
    role: measure
    description: 订单中商品的购买数量。
    alias: [销量, 购买数量, 件数]
    index_value: false
  - id: fact_order.region_id
    table_id: fact_order
    name: region_id
    role: foreign_key
    description: 关联地区维度的外键。
    alias: [地区ID, 区域ID]
    index_value: false
  - id: dim_region.region_id
    table_id: dim_region
    name: region_id
    role: primary_key
    description: 地区唯一标识。
    alias: [地区ID, 区域ID]
    index_value: false
  - id: dim_region.region_name
    table_id: dim_region
    name: region_name
    role: dimension
    description: 订单所属的大区名称，如华东、华南、华北。
    alias: [地区, 区域, 大区, 大区名称]
    examples: [华南, 华东, 西南, 华北, 华中]
    index_value: true
  - id: dim_region.province
    table_id: dim_region
    name: province
    role: dimension
    description: 订单所属省份。
    alias: [省份, 省, 所在省份]
    examples: [广东省, 浙江省, 四川省, 北京市, 上海市, 湖北省]
    index_value: true
  - id: dim_product.brand
    table_id: dim_product
    name: brand
    role: dimension
    description: 商品品牌名称。
    alias: [品牌, 品牌名称]
    examples: [苹果, 三星, 华为, 戴森, 美的, 耐克]
    index_value: true
  - id: dim_product.category
    table_id: dim_product
    name: category
    role: dimension
    description: 商品所属品类。
    alias: [商品类别, 品类, 分类]
    examples: [手机数码, 家用电器, 鞋靴, 服饰, 食品饮料]
    index_value: true
  - id: dim_customer.gender
    table_id: dim_customer
    name: gender
    role: dimension
    description: 客户性别。
    alias: [性别]
    examples: [男, 女]
    index_value: true
  - id: dim_customer.member_level
    table_id: dim_customer
    name: member_level
    role: dimension
    description: 客户会员等级。
    alias: [会员等级, 用户等级]
    examples: [黄金, 白银, 青铜, 铂金]
    index_value: true
  - id: dim_date.year
    table_id: dim_date
    name: year
    role: dimension
    description: 年份。
    alias: [年, 年份]
    index_value: false

metrics:
  - id: GMV
    name: GMV
    description: Gross Merchandise Value，所有订单成交金额之和。
    alias: [成交总额, 订单总额, 销售总额, 销售额]
    relevant_columns: [fact_order.order_amount]
  - id: AOV
    name: AOV
    description: Average Order Value，订单平均成交金额。
    alias: [平均单价, 平均订单金额, 客单价]
    relevant_columns: [fact_order.order_amount, fact_order.order_quantity]
  - id: ORDER_COUNT
    name: 订单数
    description: 订单记录条数。
    alias: [订单量, 单量, 订单笔数]
    relevant_columns: [fact_order.order_id]
