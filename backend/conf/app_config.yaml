# 非敏感配置：源码外的工程参数。
# 任何密钥都不写在这里，只由 .env / 环境变量注入（见 app/conf/app_config.py 的 Secrets）。
project:
  name: insight-agent-v2
  env: local
  timezone: Asia/Shanghai

logging:
  console:
    enable: true
    level: INFO
  file:
    enable: false
    level: INFO
    path: logs
    rotation: 10 MB
    retention: 7 days

server:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

# C 路线：单文件 SQLite 同时承担「结构化元数据 + 向量表 + 全文取值索引」三种角色
db:
  path: data/agent.db
  dialect: sqlite
  wal: true

embedding:
  provider: local-hash          # local-hash | huggingface（后者需本地模型，C 路线默认不用）
  dimension: 256                # 与 app/rag/embedder.py 的确定性哈希维度保持一致
  model: null

retrieval:
  top_k_per_route: 8
  rrf_k: 60
  final_top_k: 6
  fts_enabled: true
  keywords_top_k: 6

llm:
  provider: dashscope
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.8-max
  temperature: 0.2
  timeout_s: 20
  max_retries: 1
  # api_key 从 .env 读取 ALIQWEN_API_KEY（兼容原命名 aliQwen-api）

agent:
  mode: mock                   # mock | real；可用 .env 的 LLM_MODE 覆盖
  engine: react                # react | langgraph（/runs 默认链路；/graph/runs* 始终走 LangGraph）
  max_steps: 8
  step_timeout_s: 20
  total_timeout_s: 90
  max_sql_corrections: 2
  max_rows: 500
  mcp_enabled: false

meta_knowledge:
  config_path: conf/meta_knowledge.yaml
